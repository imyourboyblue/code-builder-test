<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PatchBay sign-in</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--ink:#1d1d1b;--mute:#6b6b66;--line:#e2e2dd;--me:#2f5bd3;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--ink:#ecece8;--mute:#9a9a93;--line:#33332f;--me:#4a74e8;--bad:#ff7b72}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:16px}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;width:100%;max-width:360px}
h1{font-size:18px;margin:0 0 4px}p{color:var(--mute);margin:0 0 16px;font-size:14px}
input{font:inherit;width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button{font:inherit;margin-top:12px;width:100%;padding:10px;border-radius:8px;border:0;background:var(--me);color:#fff;cursor:pointer}
#err{color:var(--bad);font-size:14px;margin-top:10px;min-height:1.5em}
</style></head><body>
<form id="f"><h1>Sign in to PatchBay</h1>
<p>This is the password you chose on your Mac when you started the app with --lan.</p>
<input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
<button>Sign in</button><div id="err"></div></form>
<script>
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const err=document.getElementById('err');err.textContent='Checking...';
  try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({password:document.getElementById('pw').value})});const j=await r.json();
    if(j.ok){location.reload()}else{err.textContent=j.error||'That didn\'t work.'}}
  catch(x){err.textContent='Can\'t reach your Mac. Is the app still running there?'}};
</script></body></html>
